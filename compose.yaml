name: futuranext

services:
  api:
    image: ${FN_API_IMAGE:-futuranext-api:local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FN_ENVIRONMENT: ${FN_ENVIRONMENT:-local}
      FN_DATABASE_URL: ${FN_DATABASE_URL:?Informe FN_DATABASE_URL}
      FN_SUPABASE_URL: ${FN_SUPABASE_URL:?Informe FN_SUPABASE_URL}
      FN_SUPABASE_ISSUER: ${FN_SUPABASE_ISSUER:?Informe FN_SUPABASE_ISSUER}
      FN_SUPABASE_PUBLISHABLE_KEY: ${FN_SUPABASE_PUBLISHABLE_KEY:?Informe FN_SUPABASE_PUBLISHABLE_KEY}
      FN_SUPABASE_ADMIN_KEY: ${FN_SUPABASE_ADMIN_KEY:?Informe FN_SUPABASE_ADMIN_KEY}
      FN_AUTH_MODE: ${FN_AUTH_MODE:-jwks}
      FN_FRONTEND_URL: ${FN_FRONTEND_URL:?Informe FN_FRONTEND_URL}
      FN_CORS_ORIGINS: ${FN_CORS_ORIGINS:?Informe FN_CORS_ORIGINS}
      FN_STATIC_DIR: ${FN_STATIC_DIR:-}
      FN_OPENAPI_ENABLED: ${FN_OPENAPI_ENABLED:-false}
      FN_FISCAL_MASTER_KEY: ${FN_FISCAL_MASTER_KEY:-}
      FN_EXTERNAL_INTEGRATIONS: ${FN_EXTERNAL_INTEGRATIONS:-}
      FN_WHATSAPP_SERVICE_URL: ${FN_WHATSAPP_SERVICE_URL:-}
      FN_WHATSAPP_SERVICE_TOKEN: ${FN_WHATSAPP_SERVICE_TOKEN:-}
      FN_WHATSAPP_PUBLIC_API_URL: ${FN_WHATSAPP_PUBLIC_API_URL:-}
      FN_ASAAS_ENVIRONMENT: ${FN_ASAAS_ENVIRONMENT:-sandbox}
      FN_ASAAS_API_KEY: ${FN_ASAAS_API_KEY:-}
      FN_ASAAS_WEBHOOK_TOKEN: ${FN_ASAAS_WEBHOOK_TOKEN:-}
      FN_OPENAI_API_KEY: ${FN_OPENAI_API_KEY:-}
      FN_OPENAI_MODEL: ${FN_OPENAI_MODEL:-gpt-4o-mini}
      FN_SITE_CHAT_DAILY_LIMIT: ${FN_SITE_CHAT_DAILY_LIMIT:-1500}
      FN_LEADS_EMAIL: ${FN_LEADS_EMAIL:-suporte@futuranext.com.br}
      FN_ZOHO_MAIL_REGION: ${FN_ZOHO_MAIL_REGION:-us}
      FN_ZOHO_MAIL_CLIENT_ID: ${FN_ZOHO_MAIL_CLIENT_ID:-}
      FN_ZOHO_MAIL_CLIENT_SECRET: ${FN_ZOHO_MAIL_CLIENT_SECRET:-}
      FN_ZOHO_MAIL_REFRESH_TOKEN: ${FN_ZOHO_MAIL_REFRESH_TOKEN:-}
      FN_ZOHO_MAIL_ACCOUNT_ID: ${FN_ZOHO_MAIL_ACCOUNT_ID:-}
      FN_ZOHO_MAIL_SENDER: ${FN_ZOHO_MAIL_SENDER:-}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health/ready', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
