<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convite de acesso à FuturaNext</title>
</head>
<body style="margin:0;background-color:#f3f7f3;color:#102838;font-family:Arial,sans-serif;">
  <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" bgcolor="#f3f7f3">
    <tr>
      <td align="center" style="padding:24px 16px;">
        <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" bgcolor="#ffffff"
          style="max-width:560px;border:1px solid #d8e3de;border-radius:12px;">
          <tr>
            <td bgcolor="#081a2a" style="padding:20px 24px;border-radius:11px 11px 0 0;color:#ffffff;font-size:22px;font-weight:bold;">
              Futura<span style="color:#08ce88;">Next</span>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 24px 30px;">
              <h1 style="margin:0 0 16px;color:#102838;font-size:26px;line-height:1.25;">Ative sua conta na FuturaNext</h1>
              <p style="margin:0 0 24px;font-size:16px;line-height:1.55;">
                Você recebeu um convite para acessar a Área do Cliente. Abra o portal para confirmar o convite e criar sua senha.
              </p>
              <table role="presentation" border="0" cellpadding="0" cellspacing="0">
                <tr>
                  <td bgcolor="#08ce88" style="border-radius:8px;mso-padding-alt:14px 22px;">
                    <a href="{{ .SiteURL }}/ativar-conta#token_hash={{ .TokenHash }}&amp;type=invite"
                      style="display:inline-block;padding:14px 22px;color:#062d22;font-size:16px;font-weight:bold;line-height:1.25;text-decoration:none;">Ativar minha conta</a>
                  </td>
                </tr>
              </table>
              <p style="margin:24px 0 0;color:#506673;font-size:14px;line-height:1.55;">
                O link é de uso único e expira por segurança. Se você não esperava este convite, ignore este e-mail.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
