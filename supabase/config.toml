project_id = "futuranext"

[api]
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
port = 54323

[local_smtp]
port = 54324

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:8088"
additional_redirect_urls = ["http://127.0.0.1:8088/ativar-conta", "http://127.0.0.1:8088/recuperar-senha"]
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
# O cadastro público é bloqueado por auth.enable_signup sem desligar o login.
enable_signup = true
enable_confirmations = true
otp_expiry = 1800

[auth.email.template.invite]
subject = "FuturaNext — convite de acesso"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "FuturaNext — recuperação de senha"
content_path = "./supabase/templates/recovery.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
