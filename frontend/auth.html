<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#081a2a">
  <title>{{title}} · FuturaNext</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/platform/platform.css">
  <script type="module" src="/platform/auth.js"></script>
</head>
<body class="auth-shell" data-view="{{view}}">
  <header class="auth-header">
    <a class="brand" href="/" aria-label="FuturaNext, início"><img src="/assets/logo-mark.svg" alt="" width="42" height="42"><span>Futura<span>Next</span></span></a>
    <a class="plain-link" href="/">Voltar ao site</a>
  </header>
  <main class="auth-main" id="main">
    <section class="auth-card">
      <h1>{{title}}</h1>
      <div id="screen"><p role="status">Carregando…</p></div>
      <noscript><p>Ative o JavaScript para acessar sua conta.</p></noscript>
    </section>
  </main>
</body>
</html>
