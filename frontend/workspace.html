<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#081a2a">
  <title>{{title}} · FuturaNext</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/platform/platform.css">
  <script type="module" src="/platform/{{entry}}.js"></script>
</head>
<body data-view="{{view}}">
  <a class="skip-link" href="#main">Ir para o conteúdo</a>
  <header class="workspace-header">
    <div class="workspace-wrap header-row">
      <a class="brand" href="/" aria-label="FuturaNext, início"><img src="/assets/logo-mark.svg" alt="" width="38" height="38"><span>Futura<span>Next</span></span></a>
      <div class="header-actions" id="header-actions"></div>
    </div>
  </header>
  <div class="workspace-wrap workspace-layout">
    <aside class="workspace-sidebar" aria-label="{{area}}"><nav id="navigation" aria-label="Navegação de {{area}}"></nav></aside>
    <main class="workspace-main" id="main">
      <header class="workspace-title"><p class="eyebrow">{{area}}</p><h1>{{title}}</h1></header>
      <div class="stack" id="screen"><p role="status">Carregando…</p></div>
      <noscript><p>Ative o JavaScript para acessar sua conta.</p></noscript>
    </main>
  </div>
</body>
</html>
