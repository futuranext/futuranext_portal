# Serviço WhatsApp da FuturaNext no Droplet. Projeto Compose separado da API do portal.
# A API do portal e o Caddy alcançam o backend pela rede futuranext_default com o nome whatsapp-api.
# Nenhuma porta é publicada no host. Variáveis em .env (veja docs/WHATSAPP_PUBLICACAO.md).
#
# Persistência: os dados do serviço ficam no PostgreSQL do Supabase do portal (schema privado
# whatsapp, migração Alembic 0013), acessado pelos papéis wa_api (backend) e wa_worker (worker).
# TEMPORÁRIO: a Evolution continua com PostgreSQL local (evolution-postgres) até a homologação do
# schema `evolution` no Supabase ser aprovada (docs/WHATSAPP_POSTGRES.md, seção Evolution).
name: futuranext-whatsapp

x-health: &health
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 30s

x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  redis:
    image: redis:8.6.8-alpine3.23
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Informe REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis_data:/data]
    networks: [data]
    logging: *logging
    healthcheck:
      <<: *health
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']

  # TEMPORÁRIO: banco próprio da Evolution (Prisma). Não publicar porta; manter backup do volume.
  evolution-postgres:
    image: postgres:15.19-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evolution}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Informe POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-evolution}
    volumes: [evolution_postgres_data:/var/lib/postgresql/data]
    networks: [gateway_data]
    logging: *logging
    healthcheck:
      <<: *health
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']

  evolution-redis:
    image: redis:8.6.8-alpine3.23
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${EVOLUTION_REDIS_PASSWORD:?Informe EVOLUTION_REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --appendonly yes --maxmemory 128mb --requirepass "$$REDIS_PASSWORD"']
    volumes: [evolution_redis_data:/data]
    networks: [gateway_data]
    logging: *logging
    healthcheck:
      <<: *health
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      evolution-postgres: {condition: service_healthy}
      evolution-redis: {condition: service_healthy}
    environment:
      SERVER_TYPE: http
      SERVER_PORT: '8080'
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Informe EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: 'false'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-evolution}:${POSTGRES_PASSWORD}@evolution-postgres:5432/${POSTGRES_DB:-evolution}?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: futuranext_whatsapp
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://:${EVOLUTION_REDIS_PASSWORD}@evolution-redis:6379/0
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: 'false'
      CACHE_LOCAL_ENABLED: 'false'
      TELEMETRY_ENABLED: 'false'
      LOG_LEVEL: ERROR,WARN
      LOG_BAILEYS: error
      LOG_COLOR: 'false'
      CORS_ORIGIN: http://backend:8000
      CORS_CREDENTIALS: 'false'
      WEBHOOK_GLOBAL_ENABLED: 'false'
      DEL_INSTANCE: 'false'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'false'
      DATABASE_SAVE_DATA_CONTACTS: 'false'
      DATABASE_SAVE_DATA_CHATS: 'false'
      DATABASE_SAVE_DATA_HISTORIC: 'false'
      LANGUAGE: pt-BR
    volumes: [evolution_instances:/evolution/instances]
    networks: [gateway_data, gateway, egress]
    logging: *logging
    healthcheck:
      <<: *health
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/',{headers:{apikey:process.env.AUTHENTICATION_API_KEY,Origin:'http://backend:8000'},signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  backend:
    # Tag do commit homologado, ex.: futuranext-whatsapp:3f2c1ab (veja docs/WHATSAPP_PUBLICACAO.md).
    image: ${WA_IMAGE:?Informe WA_IMAGE com a tag do commit}
    build: ./backend
    restart: unless-stopped
    environment: &backend_env
      WA_DATABASE_URL: ${WA_API_DATABASE_URL:?Informe WA_API_DATABASE_URL (papel wa_api)}
      WA_DATABASE_POOL_SIZE: ${WA_API_POOL_SIZE:-3}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      EVOLUTION_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Informe DATA_ENCRYPTION_KEY}
      AUTH_PEPPER: ${AUTH_PEPPER:?Informe AUTH_PEPPER}
      PORTAL_SERVICE_TOKEN: ${PORTAL_SERVICE_TOKEN:?Informe PORTAL_SERVICE_TOKEN}
      WEBHOOK_BASE_URL: http://backend:8000
      DOCS_ENABLED: 'false'
    volumes: &supabase_ca
      - ${SUPABASE_CA_FILE:?Informe SUPABASE_CA_FILE}:/run/futuranext/supabase-ca.crt:ro
    depends_on:
      redis: {condition: service_healthy}
      evolution: {condition: service_healthy}
    networks:
      data: {}
      gateway: {}
      portal:
        aliases: [whatsapp-api]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging: *logging
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]

  worker:
    image: ${WA_IMAGE:?Informe WA_IMAGE com a tag do commit}
    restart: unless-stopped
    command: [python, -m, app.worker]
    environment:
      <<: *backend_env
      WA_DATABASE_URL: ${WA_WORKER_DATABASE_URL:?Informe WA_WORKER_DATABASE_URL (papel wa_worker)}
      WA_DATABASE_POOL_SIZE: ${WA_WORKER_POOL_SIZE:-2}
    volumes: *supabase_ca
    depends_on:
      backend: {condition: service_healthy}
    networks: [data, gateway, egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging: *logging
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import os; from redis import Redis; assert Redis.from_url(os.environ['REDIS_URL']).exists('worker:heartbeat')"]

volumes:
  redis_data:
  evolution_postgres_data:
  evolution_redis_data:
  evolution_instances:

networks:
  data: {internal: true}
  gateway_data: {internal: true}
  gateway: {internal: true}
  egress: {}
  portal:
    external: true
    name: ${PORTAL_NETWORK:-futuranext_default}
