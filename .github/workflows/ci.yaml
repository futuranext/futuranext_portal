name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: futuranext_test
          POSTGRES_PASSWORD: futuranext_test_owner
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d futuranext_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verificar segredos no histórico
        run: |
          docker run --rm --network none \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact /repo
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Verificar landing e construir frontend
        run: |
          npm ci
          node --check script.js
          node docs/fixtures/landing-dom-smoke.cjs
          npm run build
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Instalar backend e executar lint
        run: |
          python -m pip install -e './backend[dev]'
          python -m ruff check backend scripts
      - name: Testar API e isolamento no PostgreSQL
        env:
          FN_APP_DB_PASSWORD: futuranext_test_runtime_password
          FN_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:futuranext_test_owner@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/futuranext_test
          TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:futuranext_test_owner@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/futuranext_test
          TEST_DATABASE_URL: postgresql+psycopg://fn_app:futuranext_test_runtime_password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/futuranext_test
        run: |
          python -m app.db_admin setup-role
          python -m pytest -q backend
      - name: Construir imagem da API
        run: docker build --tag futuranext-api:ci .
