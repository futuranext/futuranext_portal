[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "futuranext-platform"
version = "0.1.0"
description = "API da plataforma FuturaNext"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15,<2",
    "cryptography>=42",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "openpyxl>=3.1.5,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.8,<3",
    "PyJWT[crypto]>=2.10.1,<3",
    "SQLAlchemy>=2.0.39,<3",
    "tzdata>=2025.2",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
